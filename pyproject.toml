[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fitsproof"
version = "0.1.2"
description = "Proves your local LLM fits in memory — or refuses loudly instead of a silent OOM."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Annas Mazhar" }]
keywords = [
    "llm",
    "inference",
    "local-llm",
    "resource-contract",
    "memory-budget",
    "roofline",
    "quantization",
    "mcp",
    "openai-compatible",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy==2.2.6",
    "pyyaml==6.0.2",
]

[project.urls]
Homepage = "https://github.com/AnnasMazhar/fitsproof"
Repository = "https://github.com/AnnasMazhar/fitsproof"
Issues = "https://github.com/AnnasMazhar/fitsproof/issues"

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.1.0",
    "hypothesis==6.135.0",
    "mutmut==3.3.0",
    "ruff==0.11.13",
]

[project.scripts]
fitsproof = "fitsproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
exclude = ["mutants/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "N802",   # do_GET / do_POST are mandated by http.server.BaseHTTPRequestHandler
    "N806",   # single-letter uppercase math vars (V, L, W, H) are conventional in ML/cost models
    "E501",   # long SVG literals and math formulas that cannot be meaningfully split
]

[tool.mutmut]
paths_to_mutate = ["src/fitsproof/contract/"]
runner = ".venv/bin/python -m pytest tests/contract/ -x -q"
