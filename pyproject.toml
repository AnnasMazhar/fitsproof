[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fitsproof"
version = "0.1.2"
description = "Proves your local LLM fits in memory — or refuses loudly instead of a silent OOM."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Annas Mazhar" }]
keywords = [
    "llm",
    "inference",
    "local-llm",
    "resource-contract",
    "memory-budget",
    "roofline",
    "quantization",
    "mcp",
    "openai-compatible",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy==2.2.6",
    "pyyaml==6.0.2",
]

[project.urls]
Homepage = "https://github.com/AnnasMazhar/fitsproof"
Repository = "https://github.com/AnnasMazhar/fitsproof"
Issues = "https://github.com/AnnasMazhar/fitsproof/issues"

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.1.0",
    "hypothesis==6.135.0",
    "mutmut==3.3.0",
    "ruff==0.11.13",
]

[project.scripts]
fitsproof = "fitsproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
exclude = [
    "mutants/",
    "mutants.*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "N802",   # do_GET / do_POST are mandated by http.server.BaseHTTPRequestHandler
    "N806",   # single-letter uppercase math vars (V, L, W, H) are conventional in ML/cost models
    "E501",   # long SVG literals and math formulas that cannot be meaningfully split
]

[tool.mutmut]
# mutmut 3.3 reads ONLY these keys: also_copy, do_not_mutate, max_stack_depth, debug,
# paths_to_mutate (see Config in mutmut/__main__.py). A `runner` key is IGNORED — mutmut runs its
# own PytestRunner — so the suite cannot be scoped from here. `runner` used to sit below and gave
# the false impression that only tests/contract was run.
paths_to_mutate = ["src/fitsproof/contract/"]
# The mutants tree receives ONLY paths_to_mutate, so the rest of the package has to be listed here
# or stats collection dies with `ModuleNotFoundError: No module named 'fitsproof.client'` — which
# is what kept the mutation gate from ever producing a number (c1/c2/c3-p12 all recorded
# score=None). fitsproof/__init__.py is required because contract/ is a subpackage of it.
# DO NOT list "src/fitsproof/" (the whole package): also_copy is applied AFTER mutant generation
# (copy_src_dir -> create_mutants -> copy_also_copy_files), so it would overwrite the freshly
# generated mutants in contract/ with pristine source and every mutant would score as survived.
also_copy = [
    "src/fitsproof/__init__.py",
    "src/fitsproof/cli.py",
    "src/fitsproof/client.py",
    "src/fitsproof/mcp.py",
    "src/fitsproof/engine/",
    # Assets the test suite reads at collection/run time. mutmut needs a GREEN suite to collect
    # stats, and pytest -x stops at the first failure, so a missing asset silently reads as
    # "failed to collect stats" (first seen: test_packaging.py asserting scripts/calibration_demo.py
    # exists; README.md is read by tests/value/test_readme_snippets.py, docs/ by the link checks).
    "scripts/",
    "docs/",
    "README.md",
    "LICENSE",
]
