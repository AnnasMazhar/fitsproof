# Tag-driven release: wheel + sdist + a standalone Linux
# binary (PyInstaller one-file) with SHA256SUMS, clean-job smoke tests of both
# the binary and the wheel, a GitHub Release attaching everything, and a PyPI
# publish via trusted publishing (OIDC — no long-lived token in the repo).
#
# Nothing publishes until a v* tag is pushed, and the publish job additionally
# requires the "pypi" GitHub environment with a trusted publisher configured on
# PyPI for this repo/workflow. Configure that before the first tag.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag that does not match the package version silently produces a release whose artifact is
  # named for a different version (v0.1.1 shipped a `fitsproof-0.1.0-*.whl`). Fail before building.
  version-check:
    name: Tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert the tag matches the package version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=v$tag package=$pkg"
          test "$tag" = "$pkg" || { echo "::error::tag v$tag does not match package version $pkg — bump pyproject.toml before tagging"; exit 1; }

  build:
    name: Build wheel, sdist, standalone binary
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          pip install build==1.2.2.post1
          python -m build

      - name: Build standalone binary (PyInstaller one-file)
        run: |
          pip install pyinstaller==6.11.1 .
          pkg=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          pyinstaller --onefile --name "fitsproof-${pkg}-x86_64-unknown-linux-musl" \
            "$(python -c 'import fitsproof.cli as c; print(c.__file__)')"

      - name: Checksums
        run: |
          cd dist
          sha256sum fitsproof-* *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/fitsproof-*-x86_64-unknown-linux-musl
            dist/SHA256SUMS

  smoke-binary:
    name: Clean job — run the built binary
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Verify SHA256SUMS
        run: |
          cd artifacts
          sha256sum -c SHA256SUMS

      - name: fitsproof probe
        run: |
          binary=$(ls artifacts/fitsproof-*-x86_64-unknown-linux-musl)
          chmod +x "$binary"
          "$binary" probe

      - name: fitsproof plan
        run: |
          binary=$(ls artifacts/fitsproof-*-x86_64-unknown-linux-musl)
          "$binary" plan --budget-gb 4

      - name: fitsproof admit refusal exits 2
        run: |
          binary=$(ls artifacts/fitsproof-*-x86_64-unknown-linux-musl)
          set +e
          "$binary" admit --budget-gb 0.000001
          rc=$?
          set -e
          test "$rc" -eq 2

  smoke-wheel:
    name: Clean job — pip install the wheel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Install wheel in a clean interpreter
        run: pip install artifacts/*.whl

      - name: fitsproof plan from the installed package
        run: fitsproof plan --budget-gb 4

  github-release:
    name: Attach artifacts to a tagged GitHub Release
    needs: [build, smoke-binary, smoke-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Create release with binaries and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "$GITHUB_REF_NAME" --generate-notes

  # Publishing to PyPI is OPT-IN. It stays skipped until a trusted publisher exists for this repo on
  # PyPI (PyPI → project → Publishing → add publisher: repository=AnnasMazhar/fitsproof,
  # workflow=release.yml, environment=pypi). Until that exists the job fails with
  # `invalid-publisher`, which turns every tag red for a pure configuration reason.
  # Enable it by setting the repository variable PYPI_PUBLISH=true (Settings → Secrets and
  # variables → Actions → Variables). The wheel and sdist are still attached to the GitHub Release
  # either way, so a release is installable without PyPI.
  publish-pypi:
    name: Publish to PyPI (trusted publishing — OIDC)
    if: vars.PYPI_PUBLISH == 'true'
    needs: [build, smoke-binary, smoke-wheel]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Keep only wheel and sdist for PyPI
        run: rm -f dist/fitsproof dist/SHA256SUMS

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
